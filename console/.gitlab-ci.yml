# --------------------------------------------------------------------------------------------------
# Notes:
# - jobs are executed in the order indicated at root "stages" property
# - "needs" property needs an array of job names (not stages names)
# - linter needs install:dev as eslint and prettier are dev dependencies
# --------------------------------------------------------------------------------------------------

stages:
  - quality
  - install

#---------------------------------------------------------------------------------------------------
# QUALITY (LINTER)
#---------------------------------------------------------------------------------------------------
quality:dev:
  stage: quality
  rules:
    - if: $CI_COMMIT_BRANCH == "release"
      when: always
    - if: $CI_COMMIT_BRANCH != "release"
      when: manual
  tags:
    - nodejs-20
  variables:
    NODE_ENV: development
  script:
    - npm i || (npm cache clean --force && npm i)
    - npm run lint

#---------------------------------------------------------------------------------------------------
# INSTALL
#---------------------------------------------------------------------------------------------------
install:prod:
  stage: install
  rules:
    - if: $CI_COMMIT_BRANCH == "release"
      when: always
    - if: $CI_COMMIT_BRANCH != "release"
      when: manual
  tags:
    - nodejs-20
  variables:
    NODE_ENV: production
  script:
    - npm i || (npm cache clean --force && npm i)
