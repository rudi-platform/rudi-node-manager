stages:
  - npm_install
  - build
  - quality

# This folder is cached between builds
default:
  cache:
    paths:
      - node_modules/
      - front/node_modules/
  before_script:
    - |
      {
        echo "@aqmo.org:registry=${CI_API_V4_URL}/projects/59/packages/npm/"
        echo "${CI_API_V4_URL#https?}/projects/59/packages/npm/:_authToken=\${CI_JOB_TOKEN}"
      } | tee -a .npmrc

# npm install (Front)
install_front:
  stage: npm_install
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  tags:
    - nodejs
  variables:
    NODE_ENV: development
  script:
    - cd front && npm install

# npm install (Back)
install_back:
  stage: npm_install
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  tags:
    - nodejs
  variables:
    NODE_ENV: development
  script:
    - npm install

# Quality: back
lint_back:
  stage: quality
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  tags:
    - nodejs
  script:
    - npm run lintBack

# Quality: front
lint_front:
  stage: quality
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  tags:
    - nodejs
  script:
    - npm run lintFront

# Build front
build_front:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "release"'
    # - if: '$CI_COMMIT_BRANCH =~ /^release.*$/i'
  tags:
    - nodejs
  variables:
    NODE_ENV: development
    PUBLIC_URL: 68064ef1-1e5c-4384-8c50-626f52b78c5c
    REACT_APP_TAG: dee007ae-5efd-45d8-b81c-86e440522b55
  script:
    - cd front && npm run build
  artifacts:
    name: 'ProdManager-front-$-PUBLIC_URL-rev$CI_COMMIT_SHORT_SHA'
    paths:
      - front/build/
    expire_in: 10 week
