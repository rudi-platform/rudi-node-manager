stages:
  - install_front
  - build_front
  - install_back

#---------------------------------------------------------------------------------------------------
# FRONT: INSTALL
#---------------------------------------------------------------------------------------------------
install_front:
  stage: install_front
  rules:
    - if: $CI_COMMIT_BRANCH == "release"
      when: always
    - if: $CI_COMMIT_BRANCH != "release"
      when: manual
  tags:
    - nodejs-20
  cache:
    - key:
        files: [ ./front/package-lock.json ]
      paths:   [ ./front/node_modules/ ]
  variables:
    NODE_ENV: development
  script:
    - cd front
    - npm i

#---------------------------------------------------------------------------------------------------
# FRONT: BUILD
#---------------------------------------------------------------------------------------------------
build_front:
  stage: build_front
  needs: [install_front]
  rules:
    - if: $CI_COMMIT_BRANCH == "release"
      when: always
    - if: $CI_COMMIT_BRANCH != "release"
      when: manual  
  tags:
    - nodejs-20
  cache:
    - key:
        files: [ ./front/package-lock.json ]
      paths: [ ./front/node_modules/ ]
  variables:
    NODE_ENV: production
    PUBLIC_URL: 68064ef1-1e5c-4384-8c50-626f52b78c5c
    REACT_APP_TAG: dee007ae-5efd-45d8-b81c-86e440522b55
  script:
    - cd front
    - npm run build:prod
  artifacts:
    name: 'ProdManager-front-$PUBLIC_URL-rev$CI_COMMIT_SHORT_SHA'
    paths:
      - front/build/
    expire_in: 10 weeks

#---------------------------------------------------------------------------------------------------
# BACK: INSTALL
#---------------------------------------------------------------------------------------------------
install_back:
  stage: install_back
  needs: [build_front]
  rules:
    - if: $CI_COMMIT_BRANCH == "release"
      when: always
    - if: $CI_COMMIT_BRANCH != "release"
      when: manual
  tags:
    - nodejs-20
  cache:
    - key:
        files: [ ./package-lock.json ]
      paths:   [ ./node_modules/ ]
  variables:
    NODE_ENV: production
  script:
    - npm i