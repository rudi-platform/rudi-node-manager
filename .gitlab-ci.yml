
# This folder is cached between builds
cache:
  paths:
    - node_modules/

back_npm:
  tags:
    - nodejs
  script:
    - npm install

front_npm:
  tags:
    - nodejs
  script:
    - cd front && npm install
    
back_test:
  tags:
    - nodejs
  script:
    - npm run test

lint:
  tags:
    - nodejs
  script:
    - npm run lint

